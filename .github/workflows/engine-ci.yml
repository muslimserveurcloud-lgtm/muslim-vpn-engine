name: MUSLIM VPN ENGINE - Build and Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m compileall -q src tests

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Test network diagnostic
        run: python bin/msc-net dns localhost

      - name: Package engine source
        run: |
          zip -r muslim-vpn-engine-source.zip \
            README.md bin config docs src tests \
            .gitignore \
            -x '*/__pycache__/*' '*.pyc'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MUSLIM-VPN-ENGINE-source
          path: muslim-vpn-engine-source.zip
          if-no-files-found: error
          retention-days: 14
